<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title>PETOA 光を運ぶ子 - CHAPTER 1</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./vendor/phaser.min.js"></script>
  <script src="./js/game.js" type="module"></script>
</head>
<body>
  <main class="game-shell">
    <section class="game-panel" aria-label="PETOA CHAPTER 1">
      <div class="hud">
        <div>
          <p class="chapter">CHAPTER 1</p>
          <h1>ウペトア島</h1>
        </div>
        <div class="status">
          <span id="time-label">朝</span>
          <span id="step-label">0歩</span>
        </div>
      </div>

      <div class="viewport" id="viewport">
        <div class="phaser-stage" id="phaser-stage" aria-label="ウペトア島の村"></div>
        <div class="fade" id="fade"></div>
      </div>

      <div class="dialog" id="dialog" hidden>
        <p class="speaker" id="speaker"></p>
        <p class="message" id="message"></p>
        <button class="next-button" id="next-button" type="button">つづける</button>
      </div>

      <aside class="quest">
        <div>
          <p class="quest-title">ミッション</p>
          <ul id="quest-list"></ul>
        </div>
        <p class="hint" id="hint">矢印/WASDで移動、Enter/Spaceで話す・調べる。</p>
      </aside>

      <div class="touch-controls" aria-label="スマートフォン操作">
        <div class="dpad">
          <button type="button" data-dir="up" aria-label="上">▲</button>
          <button type="button" data-dir="left" aria-label="左">◀</button>
          <button type="button" data-dir="down" aria-label="下">▼</button>
          <button type="button" data-dir="right" aria-label="右">▶</button>
        </div>
        <div class="actions">
          <button type="button" id="touch-run">走る</button>
          <button type="button" id="touch-action">調べる</button>
          <button type="button" id="draw-item">アイテムを描く</button>
        </div>
      </div>
    </section>

    <section class="title-screen" id="title-screen" aria-label="タイトル">
      <img src="./assets/img/petoa-title-clean-v1.png" alt="PETOA 光を運ぶ子">
      <button type="button" id="start-button">NEW GAME</button>
    </section>
  </main>
</body>
</html>
