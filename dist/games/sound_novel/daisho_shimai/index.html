<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大小姉弟奇譚 - エンジン試作</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="game" class="game">
    <section id="stage" class="stage" aria-live="polite">
      <div id="bg" class="bg"></div>

      <section id="start-screen" class="start-screen">
        <div class="start-content">
          <h1>大小姉弟奇譚</h1>
          <p>第一話　雪原に消えた人</p>
          <button id="start-btn" type="button">START</button>
        </div>
      </section>

      <div id="portrait-left" class="portrait portrait-left"></div>
      <div id="portrait-center" class="portrait portrait-center"></div>
      <div id="portrait-right" class="portrait portrait-right"></div>

      <div id="evidence-layer" class="evidence-layer hidden">
        <button id="evidence-close" class="evidence-close" type="button">閉じる</button>
        <img id="evidence-image" alt="">
        <div id="evidence-placeholder" class="placeholder"></div>
      </div>

      <section id="message-box" class="message-box">
        <div id="speaker" class="speaker"></div>
        <div id="text" class="text"></div>
        <div id="continue-mark" class="continue-mark">▼</div>
      </section>

      <section id="choice-box" class="choice-box hidden"></section>
      <section id="deduction-box" class="choice-box hidden"></section>

      <div id="chapter-title" class="chapter-title hidden"></div>
      <div id="fade" class="fade-layer"></div>
    </section>

    <nav class="controls" aria-label="ゲーム操作">
      <button id="back-btn" type="button">BACK</button>
      <button id="log-btn" type="button">LOG</button>
      <button id="save-btn" type="button">SAVE</button>
      <button id="load-btn" type="button">LOAD</button>
      <button id="mute-btn" type="button">MUTE</button>
    </nav>

    <dialog id="log-dialog">
      <h2>バックログ</h2>
      <div id="log-content"></div>
      <button id="log-close" type="button">閉じる</button>
    </dialog>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
